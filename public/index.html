<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cdn · files</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <button type="button" class="railbtn" id="railbtn" aria-label="Folders">☰</button>
    <span class="brand"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 17a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.9a2 2 0 0 1-1.69-.9l-.81-1.2a2 2 0 0 0-1.67-.9H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"/><path d="M2 8v11a2 2 0 0 0 2 2h14"/></svg><b>cdn</b><span class="host">.ramonfabrega.com</span></span>
    <label class="search">
      <span class="sicon">⌕</span>
      <input id="q" type="search" placeholder="search files…" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
    </label>
    <button type="button" class="permbtn" id="permbtn" title="show only permanent files" aria-label="show only permanent files"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg></button>
    <button type="button" class="signout" onclick="location.href='/logout'">Sign out</button>
  </header>

  <!-- The loading skeleton (rail rows + the home shapes below) is STATIC HTML on
       purpose: it must paint in the same frame as the shell. Do NOT move it back
       to a JS build step — doing so reintroduces a "shell, then skeleton, then
       data" 3-paint flash (any layout read like offsetWidth makes it worse).
       app.js overwrites #rail/#list with real data on load. "Overview"/"All files"
       are real; folder rows + the home tiles/ring/rows are placeholders sized to
       the loaded UI (the default view is the Overview sunburst). -->
  <div class="body">
    <nav class="rail" id="rail">
      <div class="sitem on" style="padding-left:10px"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg><span class="lbl">Overview</span></div>
      <div class="sitem" style="padding-left:10px"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 17a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.9a2 2 0 0 1-1.69-.9l-.81-1.2a2 2 0 0 0-1.67-.9H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"/><path d="M2 8v11a2 2 0 0 0 2 2h14"/></svg><span class="lbl">All files</span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:10px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:46px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:10px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:52px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:24px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:40px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:24px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:56px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:24px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:80px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:10px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:56px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:24px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:64px"></span><span class="n shimmer s-cnt"></span></div>
      <div class="sitem" style="padding-left:10px"><span class="ico shimmer s-sq"></span><span class="shimmer s-lbl" style="width:40px"></span><span class="n shimmer s-cnt"></span></div>
    </nav>
    <main class="main">
      <div class="mainbar">
        <span class="scope" id="scope">Overview</span>
        <span class="count" id="count"><span class="skel-txt shimmer" style="width:22px"></span> files</span>
        <button type="button" class="mbtn" id="upload"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>upload</button>
        <button type="button" class="mbtn" id="newfld"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>folder</button>
      </div>
      <input type="file" id="fileinput" multiple hidden>
      <div class="list" id="list">
      <div class="home">
        <div class="tiles">
          <div class="s-tile shimmer"></div><div class="s-tile shimmer"></div><div class="s-tile shimmer"></div><div class="s-tile shimmer"></div>
        </div>
        <div class="hgrid">
          <div class="chart" style="display:grid;place-items:center"><div class="s-ring shimmer"></div></div>
          <div class="hside">
            <div class="s-hrow shimmer" style="width:92%"></div>
            <div class="s-hrow shimmer" style="width:84%"></div>
            <div class="s-hrow shimmer" style="width:96%"></div>
            <div class="s-hrow shimmer" style="width:78%"></div>
            <div class="s-hrow shimmer" style="width:88%"></div>
            <div class="s-hrow shimmer" style="width:70%"></div>
            <div class="s-hrow shimmer" style="width:82%"></div>
            <div class="s-hrow shimmer" style="width:64%"></div>
          </div>
        </div>
      </div>
    </div>
      <div class="dropzone" id="dropzone">
        <div class="dz-inner">
          <svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span id="dztext">Drop files to upload</span>
        </div>
      </div>
    </main>
  </div>

  <div class="rail-scrim" id="railScrim"></div>
  <div class="pscrim" id="pscrim"></div>
  <aside class="preview" id="preview"></aside>
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet">
    <div class="sh"><span id="sheettitle">…</span><button type="button" class="x" id="sheetx">×</button></div>
    <div class="sbody" id="sbody"></div>
  </div>
  <div class="menu" id="menu"></div>
  <div class="tip" id="tip"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cdn · files</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <button type="button" class="railbtn" id="railbtn" aria-label="Folders">☰</button>
    <span class="brand"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 17a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.9a2 2 0 0 1-1.69-.9l-.81-1.2a2 2 0 0 0-1.67-.9H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"/><path d="M2 8v11a2 2 0 0 0 2 2h14"/></svg><b>cdn</b><span class="host">.ramonfabrega.com</span></span>
    <label class="search">
      <span class="sicon">⌕</span>
      <input id="q" type="search" placeholder="search files…" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
    </label>
    <button type="button" class="signout" onclick="location.href='/logout'">Sign out</button>
  </header>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="main">
      <div class="mainbar">
        <span class="scope" id="scope"></span>
        <span class="count" id="count"></span>
        <button type="button" class="mbtn" id="newfld"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>folder</button>
      </div>
      <div class="list" id="list"></div>
    </main>
  </div>

  <div class="rail-scrim" id="railScrim"></div>
  <div class="pscrim" id="pscrim"></div>
  <aside class="preview" id="preview"></aside>
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet">
    <div class="sh"><span id="sheettitle">…</span><button type="button" class="x" id="sheetx">×</button></div>
    <div class="sbody" id="sbody"></div>
  </div>
  <div class="menu" id="menu"></div>
  <div class="toast" id="toast"></div>

  <script>
    // First-paint skeleton — rendered synchronously here (this runs during parse,
    // before the deferred module below), so the very first paint is the loading
    // state, never an empty styled shell. app.js then swaps in the real rail + rows.
    (() => {
      const el = (id) => document.getElementById(id);
      const bar = (w) => `<span class="shimmer" style="width:${w}"></span>`;
      const cell = (cls) => `<span class="shimmer ${cls}"></span>`;
      el("rail").innerHTML = [68, 50, 60, 42, 64, 38].map((w) => `<div class="skel-r">${bar(`${w}%`)}</div>`).join("");
      el("scope").textContent = "All files"; // default scope is known up front; only the count is unknown
      el("count").innerHTML = `<span class="skel-txt shimmer" style="width:22px"></span> files`;
      const head =
        '<div class="hd"><span>Name <i class="ar">▲</i></span><span class="typecol">Type</span>' +
        '<span class="ralign">Size</span><span class="dtcol">Modified</span><span></span></div>';
      const skel = (w) => `<div class="skel">${bar(w)}${cell("typecol s-badge")}${cell("s-sz")}${cell("dtcol s-dt")}</div>`;
      const rows = Math.max(8, Math.ceil((innerHeight - 150) / 44));
      el("list").innerHTML = head + Array.from({ length: rows }, (_, i) => skel(`${30 + ((i * 13) % 45)}%`)).join("");
    })();
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
